name: Nova Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Nova APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nova
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android bundle directory
        run: mkdir -p android/app/src/main/assets

      - name: Bundle React Native JavaScript
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Prepare Nova APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Nova Messenger.apk

      - name: Upload Nova APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-Release
          path: release/Nova.apk
          if-no-files-found: error